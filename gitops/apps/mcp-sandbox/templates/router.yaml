apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app: sandbox-router
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app: sandbox-router
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
        app.kubernetes.io/name: sandbox-router
    spec:
      serviceAccountName: sandbox-router
      automountServiceAccountToken: false
      containers:
        - name: router
          image: registry.k8s.io/agent-sandbox/sandbox-router-go:v1.0.5
          imagePullPolicy: IfNotPresent
          args:
            - --http-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --cluster-domain=cluster.local
            - --proxy-timeout=30s
            - --cache-enabled=false
          ports:
            - name: proxy
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: agent-sandbox-system
spec:
  type: ClusterIP
  selector:
    app: sandbox-router
  ports:
    - name: http
      port: 8080
      targetPort: proxy
