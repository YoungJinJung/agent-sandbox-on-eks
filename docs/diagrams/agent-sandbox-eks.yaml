Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/v0.24/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - Agent
        - AWSCloud
        - Internet

    Agent:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "AI Agent / Demo Driver"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Title: "AWS Cloud"
      Direction: vertical
      Children:
        - Region

    Region:
      Type: AWS::Region
      Title: "AWS Region"
      Direction: vertical
      Children:
        - RegionalServices
        - VPC
        - Observability

    RegionalServices:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - EKSControlPlane
        - SandboxIAMRole
        - DNSFirewall
        - FirewallPolicy

    EKSControlPlane:
      Type: AWS::EKS
      Title: "EKS managed control plane"

    SandboxIAMRole:
      Type: AWS::IAM::Role
      Title: "IRSA: least-privilege role"

    DNSFirewall:
      Type: AWS::Route53Resolver::FirewallRuleGroup
      Title: "Route 53 DNS Firewall\n(domain allowlist)"

    FirewallPolicy:
      Type: AWS::NetworkFirewall
      Title: "AWS Network Firewall\n(shared HTTPS domain policy)"

    VPC:
      Type: AWS::EC2::VPC
      Title: "VPC — two Availability Zones"
      Direction: vertical
      Children:
        - VPCEndpoints
        - AvailabilityZones
      BorderChildren:
        - Position: S
          Resource: InternetGateway

    AvailabilityZones:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - AZA
        - AZB

    AZA:
      Type: AWS::EC2::AvailabilityZone
      Title: "AZ-a"
      Direction: vertical
      Children:
        - SystemSubnetA
        - SandboxSubnetA
        - FirewallSubnetA
        - PublicSubnetA

    AZB:
      Type: AWS::EC2::AvailabilityZone
      Title: "AZ-b"
      Direction: vertical
      Children:
        - SystemSubnetB
        - SandboxSubnetB
        - FirewallSubnetB
        - PublicSubnetB

    SystemSubnetA:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private — EKS system"
      Children:
        - SystemWorkloadsA

    SystemSubnetB:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private — EKS system"
      Children:
        - SystemWorkloadsB

    SystemWorkloadsA:
      Type: AWS::Diagram::Resource
      Preset: Generic application
      Title: "EKS system pods\nRouter · Controller · Kyverno · CoreDNS"

    SystemWorkloadsB:
      Type: AWS::Diagram::Resource
      Preset: Generic application
      Title: "EKS system pods\nRouter · Controller · Kyverno · CoreDNS"

    SandboxSubnetA:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private — Sandbox"
      Children:
        - SandboxRuntimeA

    SandboxSubnetB:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private — Sandbox"
      Children:
        - SandboxRuntimeB

    SandboxRuntimeA:
      Type: AWS::Diagram::Resource
      Preset: AWS Fargate
      Title: "Fargate Sandbox Pod\nMCP / Agent Skill\nIRSA · SGP · TTL"

    SandboxRuntimeB:
      Type: AWS::Diagram::Resource
      Preset: AWS Fargate
      Title: "Fargate Sandbox Pod\nMCP / Agent Skill\nIRSA · SGP · TTL"

    FirewallSubnetA:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Dedicated firewall subnet"
      Children:
        - FirewallEndpointA

    FirewallSubnetB:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Dedicated firewall subnet"
      Children:
        - FirewallEndpointB

    FirewallEndpointA:
      Type: AWS::Diagram::Resource
      Preset: AWS Network Firewall
      Title: "Firewall endpoint\n(shared policy)"

    FirewallEndpointB:
      Type: AWS::Diagram::Resource
      Preset: AWS Network Firewall
      Title: "Firewall endpoint\n(shared policy)"

    PublicSubnetA:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Public — egress to IGW"
      Children:
        - NATGatewayA

    PublicSubnetB:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Public — egress to IGW"
      Children:
        - NATGatewayB

    NATGatewayA:
      Type: AWS::EC2::NatGateway
      Title: "NAT gateway"

    NATGatewayB:
      Type: AWS::EC2::NatGateway
      Title: "NAT gateway"

    InternetGateway:
      Type: AWS::EC2::InternetGateway

    VPCEndpoints:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - AWSServiceEndpoints

    AWSServiceEndpoints:
      Type: AWS::EC2::VPCEndpoint
      Title: "Private AWS service endpoints: STS · ECR · S3"

    Observability:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - CloudTrail
        - ResolverQueryLogs
        - CloudWatchLogs

    CloudTrail:
      Type: AWS::CloudTrail
      Title: "CloudTrail\n(AWS API activity)"

    ResolverQueryLogs:
      Type: AWS::Route53Resolver::ResolverQueryLoggingConfig
      Title: "Resolver Query Logs\n(DNS activity)"

    CloudWatchLogs:
      Type: AWS::Logs
      Title: "CloudWatch Logs\n(Firewall + VPC Flow Logs)"

    Internet:
      Type: AWS::Diagram::Resource
      Preset: Internet
      Title: "Internet\n(only allowlisted HTTPS)"

  Links:
    - Source: SystemWorkloadsA
      Target: SandboxRuntimeA
      Type: orthogonal
      TargetArrowHead:
        Type: Open

    - Source: SandboxSubnetA
      SourcePosition: S
      Target: FirewallEndpointA
      TargetPosition: N
      Type: orthogonal
      TargetArrowHead:
        Type: Open

    - Source: SandboxSubnetB
      SourcePosition: S
      Target: FirewallEndpointB
      TargetPosition: N
      Type: orthogonal
      TargetArrowHead:
        Type: Open

    - Source: FirewallEndpointA
      SourcePosition: S
      Target: NATGatewayA
      TargetPosition: N
      Type: orthogonal
      TargetArrowHead:
        Type: Open

    - Source: FirewallEndpointB
      SourcePosition: S
      Target: NATGatewayB
      TargetPosition: N
      Type: orthogonal
      TargetArrowHead:
        Type: Open

    - Source: NATGatewayA
      Target: InternetGateway
      Type: orthogonal
      TargetArrowHead:
        Type: Open

    - Source: NATGatewayB
      Target: InternetGateway
      Type: orthogonal
      TargetArrowHead:
        Type: Open
