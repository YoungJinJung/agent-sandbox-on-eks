{{- if .Values.installAccess }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-tools
  namespace: sandbox-demo
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.sandboxRoleArn | quote }}
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: mcp-sandbox
  namespace: sandbox-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-sandbox
  securityGroups:
    groupIds:
      - {{ .Values.sandboxSecurityGroupId | quote }}
{{- end }}
