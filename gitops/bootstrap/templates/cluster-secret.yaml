apiVersion: v1
kind: Secret
metadata:
  name: cluster-{{ .Values.cluster.name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    gitops-bridge: enabled
  annotations:
    gitops-bridge/cluster-name: {{ .Values.cluster.name | quote }}
    gitops-bridge/aws-region: {{ .Values.cluster.region | quote }}
    gitops-bridge/repository-url: {{ .Values.cluster.gitopsRepository | quote }}
    gitops-bridge/sandbox-image-repository: {{ .Values.cluster.sandboxImageRepository | quote }}
    gitops-bridge/sandbox-image-tag: {{ .Values.cluster.sandboxImageTag | quote }}
    gitops-bridge/sandbox-role-arn: {{ .Values.cluster.sandboxRoleArn | quote }}
    gitops-bridge/sandbox-security-group-id: {{ .Values.cluster.sandboxSecurityGroupId | quote }}
    gitops-bridge/router-security-group-id: {{ .Values.cluster.routerSecurityGroupId | quote }}
type: Opaque
stringData:
  name: {{ .Values.cluster.name | quote }}
  server: https://kubernetes.default.svc
  config: {{ dict "tlsClientConfig" (dict "insecure" false "caData" .Values.cluster.caData) | toJson | quote }}
